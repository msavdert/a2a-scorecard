name: ci

on:
  push:
    branches: [main]
    # The monthly scan bot commits data and a regenerated report; a JSONL
    # append does not need a full test matrix (ADR-0022).
    paths-ignore:
      - "data/runs/**"
      - "data/index.json"
      - "docs/ECOSYSTEM.md"
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: make check
