[project]
name = "a2a-scorecard"
version = "0.3.0"
description = "Independent conformance scanner and scorecard for A2A (Agent2Agent) protocol endpoints"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "msavdert" }]
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.23",
    "referencing>=0.35",
]

[project.scripts]
a2a-scorecard = "a2a_scorecard.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_scorecard"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["a2a_scorecard"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
